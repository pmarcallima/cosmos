services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cosmos
      POSTGRES_USER: cosmos
      POSTGRES_PASSWORD: cosmos
    ports:
      - "5432:5432"
    volumes:
      - cosmos-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  cosmos-postgres:
