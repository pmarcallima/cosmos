spring:
  application:
    name: cosmos-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cosmos}
    username: ${DATABASE_USERNAME:cosmos}
    password: ${DATABASE_PASSWORD:cosmos}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
server:
  port: ${PORT:8080}
